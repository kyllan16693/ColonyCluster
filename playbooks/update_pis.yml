# This playbook updates all nodes in the Pi cluster.
# For control nodes, it will print reboot status if needed.
# For compute nodes, it will automatically reboot if needed.
# This is the same as ssh-ing into all the nodes and running the following commands:
  # sudo apt update
  # sudo apt upgrade -y
  # sudo apt autoremove -y
  # sudo apt clean
  # sudo apt autoclean
# Then rebooting if required.

---
- name: Update all Pi nodes
  hosts: pi_cluster
  become: yes
  
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
      
    - name: Upgrade all packages
      apt:
        upgrade: yes
        
    - name: Clean apt cache
      apt:
        autoclean: yes
        
    - name: Autoremove unused packages
      apt:
        autoremove: yes
        
    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required
      
    - name: Print reboot status for control node
      debug:
        msg: "Reboot is required on control node"
      when: reboot_required.stat.exists and inventory_hostname in groups['pi_control']
      
    - name: Reboot compute nodes if required
      reboot:
        msg: "Reboot initiated by Ansible due to package updates"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
      when: reboot_required.stat.exists and inventory_hostname in groups['pi_compute']
